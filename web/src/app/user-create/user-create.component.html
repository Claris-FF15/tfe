<div class="create-page">
  <div class="create-card">

    <button class="back-btn" (click)="goBack()">&#8592; Retour</button>

    <h2>Ajouter un utilisateur</h2>

    <form [formGroup]="createForm" (ngSubmit)="onSubmit()" autocomplete="off">

      <label>Prénom</label>
      <input type="text" formControlName="first_name" autocomplete="off" />

      <label>Nom</label>
      <input type="text" formControlName="last_name" autocomplete="off" />

      <label>Email</label>
      <input type="email" formControlName="email" autocomplete="new-email" />

      <ng-container *ngIf="isSecurityOfficer">
        <label>Rôle</label>
        <select formControlName="role_id">
          <option *ngFor="let role of roles" [ngValue]="role.id">{{ role.name }}</option>
        </select>
      </ng-container>

      <ng-container *ngIf="passwordRequired">
        <label>Mot de passe</label>
        <input type="password" formControlName="password" autocomplete="new-password" />
      </ng-container>

      <p class="info-note" *ngIf="!passwordRequired">
        Ce rôle n'a pas accès à l'application — aucun mot de passe requis.
      </p>

      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="submit-btn" [disabled]="createForm.invalid">
        Créer l'utilisateur
      </button>

    </form>

  </div>

  <!-- Modale de confirmation pour la création d'un responsable sécurité -->
  <div class="modal-overlay" *ngIf="showConfirmModal">
    <div class="modal-card">
      <h3>Confirmation requise</h3>
      <p>Vous êtes sur le point de créer un compte <strong>responsable sécurité</strong>. Entrez votre mot de passe pour confirmer.</p>

      <input
        type="password"
        [formControl]="confirmPasswordControl"
        placeholder="Votre mot de passe"
        autocomplete="current-password"
      />

      <div class="error" *ngIf="confirmError">{{ confirmError }}</div>

      <div class="modal-actions">
        <button type="button" class="cancel-btn" (click)="cancelConfirm()">Annuler</button>
        <button type="button" class="submit-btn" [disabled]="confirmPasswordControl.invalid" (click)="onConfirmPassword()">
          Confirmer
        </button>
      </div>
    </div>
  </div>
</div>
