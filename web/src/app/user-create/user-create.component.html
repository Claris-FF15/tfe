<div class="create-page">
  <div class="create-card">

    <button class="back-btn" (click)="goBack()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Retour
    </button>

    <h2>Ajouter un utilisateur</h2>

    <form [formGroup]="createForm" (ngSubmit)="onSubmit()">

      <label>Prénom</label>
      <input type="text" formControlName="first_name" />

      <label>Nom</label>
      <input type="text" formControlName="last_name" />

      <label>Email</label>
      <input type="email" formControlName="email" />

      <ng-container *ngIf="isSecurityOfficer">
        <label>Rôle</label>
        <select formControlName="role_id">
          <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
        </select>
      </ng-container>

      <ng-container *ngIf="passwordRequired">
        <label>Mot de passe</label>
        <input type="password" formControlName="password" />
      </ng-container>

      <p class="info-note" *ngIf="!passwordRequired">
        Ce rôle n'a pas accès à l'application — aucun mot de passe requis.
      </p>

      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="submit-btn" [disabled]="createForm.invalid">
        Créer l'utilisateur
      </button>

    </form>

  </div>
</div>
