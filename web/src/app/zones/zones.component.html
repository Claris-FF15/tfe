<div class="zones-container">

  <div class="zones-header">
    <h2>Zones et accès</h2>
    <button class="add-btn" (click)="goToCreate()">+ Créer une zone</button>
  </div>

  <div class="zone-block" *ngFor="let zone of zones">
    <div class="zone-header">
      <h3>{{ zone.name }}</h3>
    </div>
    <p class="zone-desc" *ngIf="zone.description">{{ zone.description }}</p>

    <div class="doors-list" *ngIf="zone.doors.length > 0">
      <div class="door-row" *ngFor="let door of zone.doors" (click)="goToDoor(door.id)" role="button" tabindex="0">
        <span class="door-name">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="6" width="18" height="12" rx="2"/>
            <circle cx="9" cy="12" r="2"/>
            <path d="M14 10h4M14 14h3"/>
          </svg>
          {{ door.name }}
        </span>
        <span class="door-location">{{ door.location }}</span>
        <span class="door-status" [class.status-active]="door.active" [class.status-inactive]="!door.active">
          {{ door.active ? 'Actif' : 'Inactif' }}
        </span>
      </div>
    </div>

    <p class="empty-note" *ngIf="zone.doors.length === 0">Aucun accès dans cette zone.</p>
  </div>

  <p class="empty-note" *ngIf="!loading && zones.length === 0">Aucune zone configurée.</p>

</div>
