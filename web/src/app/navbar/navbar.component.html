<nav class="navbar" [class.collapsed]="collapsed">

  <div class="navbar-header">
    <div class="brand" *ngIf="!collapsed">
      <h3>BadgeApp</h3>
    </div>
    <button class="toggle-btn" (click)="toggle()" [attr.aria-label]="collapsed ? 'Déplier le menu' : 'Réduire le menu'">
      <span *ngIf="!collapsed">&#8592;</span>
      <span *ngIf="collapsed">&#8594;</span>
    </button>
  </div>

  <div class="nav-links">
    <a routerLink="/activities" routerLinkActive="active" [title]="collapsed ? 'Activities' : ''">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
          <path d="M8 9h8M8 13h8M8 17h4"/>
        </svg>
      </span>
      <span class="label" *ngIf="!collapsed">Activities</span>
    </a>

    <a routerLink="/incidents" routerLinkActive="active" [title]="collapsed ? 'Incidents' : ''">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3l9 17H3z"/>
          <path d="M12 10v4M12 17h.01"/>
        </svg>
      </span>
      <span class="label" *ngIf="!collapsed">Incidents</span>
    </a>

    <a routerLink="/users" routerLinkActive="active" [title]="collapsed ? 'Users' : ''">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="8" r="3"/>
          <path d="M2 20c0-3.3 3-6 7-6s7 2.7 7 6"/>
          <circle cx="18" cy="9" r="2.5"/>
          <path d="M22 20c0-2.5-2-4.5-4.5-5"/>
        </svg>
      </span>
      <span class="label" *ngIf="!collapsed">Users</span>
    </a>

    <a routerLink="/badges" routerLinkActive="active" [title]="collapsed ? 'Badges' : ''">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="6" width="18" height="12" rx="2"/>
          <circle cx="9" cy="12" r="2"/>
          <path d="M14 10h4M14 14h3"/>
        </svg>
      </span>
      <span class="label" *ngIf="!collapsed">Badges</span>
    </a>

    <a routerLink="/zones" routerLinkActive="active" [title]="collapsed ? 'Zones' : ''">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="11" width="14" height="9" rx="2"/>
          <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
        </svg>
      </span>
      <span class="label" *ngIf="!collapsed">Zones</span>
    </a>
  </div>

  <div class="navbar-footer">
    <div class="user-info" *ngIf="!collapsed && (currentUser$ | async) as user"
         (click)="goToProfile()" role="button" tabindex="0">
      <div class="avatar">{{ user.first_name.charAt(0).toUpperCase() }}</div>
      <div class="user-details">
        <span class="user-name">{{ user.first_name }} {{ user.last_name }}</span>
        <span class="user-role">{{ user.role.name }}</span>
      </div>
    </div>
    <button class="logout-btn" (click)="onLogout()" [title]="collapsed ? 'Déconnexion' : ''">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5"/>
          <path d="M21 12H9"/>
        </svg>
      </span>
      <span class="label" *ngIf="!collapsed">Déconnexion</span>
    </button>
  </div>

</nav>
