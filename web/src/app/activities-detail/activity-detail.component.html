<div class="detail-page">
  <div class="detail-card" *ngIf="!loading && log">

    <button class="back-btn" (click)="goBack()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Retour
    </button>

    <div class="detail-header" [class.header-denied]="!log.allowed">
      <div class="status-icon">
        <svg *ngIf="log.allowed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        <svg *ngIf="!log.allowed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </div>
      <h2>{{ log.allowed ? 'Accès autorisé' : 'Accès refusé' }}</h2>
    </div>

    <div class="info-row">
      <span class="info-label">Utilisateur</span>
      <span class="info-value">{{ log.user ? (log.user.first_name + ' ' + log.user.last_name) : 'Inconnu' }}</span>
    </div>

    <div class="info-row">
      <span class="info-label">Porte</span>
      <span class="info-value">{{ log.door?.name ?? 'Inconnue' }}</span>
    </div>

    <div class="info-row">
      <span class="info-label">Date</span>
      <span class="info-value">{{ log.timestamp | date:'dd/MM/yyyy HH:mm:ss' }}</span>
    </div>

    <div class="info-row" *ngIf="log.reason">
      <span class="info-label">Raison</span>
      <span class="info-value">{{ log.reason }}</span>
    </div>

  </div>

  <div class="detail-card" *ngIf="!loading && !log">
    <p class="error">{{ errorMessage }}</p>
    <button class="back-btn" (click)="goBack()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Retour
    </button>
  </div>
</div>
