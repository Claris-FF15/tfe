<div class="create-page">
  <div class="create-card">

    <button class="back-btn" (click)="goBack()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Retour
    </button>

    <h2>Ajouter un badge</h2>

    <form [formGroup]="createForm" (ngSubmit)="onSubmit()">

      <label>ID Badge (UID)</label>
      <input type="text" formControlName="uid" placeholder="Ex: BADGE042" />

      <label>Utilisateur lié (optionnel)</label>
      <select formControlName="user_id">
        <option [ngValue]="null">Aucun utilisateur pour l'instant</option>
        <option *ngFor="let user of users" [ngValue]="user.id">
          {{ user.first_name }} {{ user.last_name }}
        </option>
      </select>

      <label>Statut</label>
      <select formControlName="active">
        <option [value]="true">Actif</option>
        <option [value]="false">Inactif</option>
      </select>

      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="submit-btn" [disabled]="createForm.invalid">
        Créer le badge
      </button>

    </form>

  </div>
</div>
